[package]
name = "cosmotwin"
version = "0.1.0"
edition = "2021"
description = "CosmoTwin - the rewrite-hypothesis benchmark: the same in-memory cache core implemented in Rust (this) and Python asyncio (python_twin/), with identical op sequences, to measure how much a compiled language actually buys."

[dependencies]
# The single dependency. Async concurrency IS the thing being compared, so
# tokio is the Rust counterpart of Python's asyncio - both first-party stacks.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[profile.release]
lto = true
codegen-units = 1
