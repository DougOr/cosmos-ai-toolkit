[project]
name = "quasar-ai"
version = "0.1.0"
description = "QuasarAI - async-first Azure Cosmos DB caching engine for LLM workloads. 100% local on the Cosmos DB emulator, zero cloud required."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "azure-cosmos[aio]>=4.7.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
quasar-ai = "quasar_ai.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quasar_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "emulator: integration tests that require the local Azure Cosmos DB emulator on https://localhost:8081",
]

[tool.ruff]
line-length = 100
target-version = "py311"
