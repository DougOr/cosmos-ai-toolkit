[project]
name = "orbitbench"
version = "0.1.0"
description = "OrbitBench AI - pluggable cache backends (Cosmos DB / in-memory / Redis) with honest, reproducible benchmarks: p50/p95/p99, hit ratios, ops/s. 100% local on the Cosmos DB emulator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "azure-cosmos[aio]>=4.7.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0.0"]

[project.scripts]
orbitbench = "orbitbench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbitbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "emulator: integration tests that require the local Azure Cosmos DB emulator on https://localhost:8081",
]

[tool.ruff]
line-length = 100
target-version = "py311"
